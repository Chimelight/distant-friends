name: Dependabot auto-merge

# Builds + type-checks every Dependabot PR. If it passes AND the bump is
# patch/minor, the PR is squash-merged automatically. Major bumps (and any
# failing build) are left open for you to review by hand.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Gate: same checks that matter for deploy, plus type-check ---
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check

      # --- Merge only patch/minor (a group containing a major reports major) ---
      - name: Auto-merge patch & minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
